# Healthcare Appointment System — default: local, in-memory, no setup needed.
server.port=8080
spring.application.name=healthcare-appointment

# In-memory H2 database (default). Data resets on restart — fine for a demo.
spring.datasource.url=jdbc:h2:mem:healthdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging: services log entity IDs only, never patient names, dates of birth,
# phone numbers, email addresses, or other sensitive details.
logging.level.com.healthcare=INFO

